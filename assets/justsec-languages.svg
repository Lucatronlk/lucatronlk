<svg xmlns="http://www.w3.org/2000/svg" width="467" height="195" viewBox="0 0 467 195" role="img" aria-labelledby="title desc">
  <title id="title">Most Used Languages</title>
  <desc id="desc">Languages I work in: Python, TypeScript, Shell, Go, Terraform, JavaScript, HTML and CSS. Static card.</desc>
  <defs>
    <clipPath id="card"><rect width="467" height="195" rx="16"/></clipPath>
    <clipPath id="bar"><rect x="25" y="60" width="417" height="8" rx="4"/></clipPath>
  </defs>
  <rect width="467" height="195" rx="16" fill="#0A0F1C"/>
  <g clip-path="url(#card)">
    <text x="25" y="40" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="18" font-weight="600" fill="#00D5FF">Most Used Languages</text>
    <g clip-path="url(#bar)">
      <rect x="25" y="60" width="245" height="8" fill="#00E5FF"/>
      <rect x="270" y="60" width="66" height="8" fill="#3882F6"/>
      <rect x="336" y="60" width="49" height="8" fill="#885CFF"/>
      <rect x="385" y="60" width="33" height="8" fill="#D946EF"/>
      <rect x="418" y="60" width="24" height="8" fill="#FF3DC8"/>
    </g>
    <g font-family="'Segoe UI', Ubuntu, sans-serif" font-size="14" fill="#F8FAFC">
      <circle cx="25" cy="100" r="4.5" fill="#00E5FF"/><text x="40" y="105">Python</text>
      <circle cx="180" cy="100" r="4.5" fill="#885CFF"/><text x="195" y="105">Go</text>
      <circle cx="335" cy="100" r="4.5" fill="#3882F6"/><text x="350" y="105">HTML</text>

      <circle cx="25" cy="135" r="4.5" fill="#3882F6"/><text x="40" y="140">TypeScript</text>
      <circle cx="180" cy="135" r="4.5" fill="#D946EF"/><text x="195" y="140">Terraform</text>
      <circle cx="335" cy="135" r="4.5" fill="#00E5FF"/><text x="350" y="140">CSS</text>

      <circle cx="25" cy="170" r="4.5" fill="#885CFF"/><text x="40" y="175">Shell</text>
      <circle cx="180" cy="170" r="4.5" fill="#FF3DC8"/><text x="195" y="175">JavaScript</text>
    </g>
  </g>
</svg>
