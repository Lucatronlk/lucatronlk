    <circle cx="150" cy="105" r="4.5" fill="#FF3DC8"/><text x="165" y="110">Terraform</text>

    <circle cx="25" cy="145" r="4.5" fill="#3882F6"/><text x="40" y="150">TypeScript</text>
    <circle cx="150" cy="145" r="4.5" fill="#00E5FF"/><text x="165" y="150">JavaScript</text>

    <circle cx="25" cy="185" r="4.5" fill="#885CFF"/><text x="40" y="190">Shell</text>
    <circle cx="150" cy="185" r="4.5" fill="#3882F6"/><text x="165" y="190">HTML</text>

    <circle cx="25" cy="225" r="4.5" fill="#D946EF"/><text x="40" y="230">Go</text>
    <circle cx="150" cy="225" r="4.5" fill="#885CFF"/><text x="165" y="230">CSS</text>
