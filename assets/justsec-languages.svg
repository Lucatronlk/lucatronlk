<svg xmlns="http://www.w3.org/2000/svg" width="320" height="195" viewBox="0 0 320 195" role="img" aria-labelledby="title desc">
  <title id="title">Most Used Languages</title>
  <desc id="desc">Languages I work in: Python, TypeScript, Shell, Go, Terraform, JavaScript, HTML and CSS. Static card.</desc>
  <defs>
    <clipPath id="card"><rect width="320" height="195" rx="16"/></clipPath>
    <clipPath id="bar"><rect x="25" y="60" width="270" height="8" rx="4"/></clipPath>
  </defs>
  <rect width="320" height="195" rx="16" fill="#0A0F1C"/>
  <g clip-path="url(#card)">
    <text x="25" y="40" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="18" font-weight="600" fill="#00D5FF">Most Used Languages</text>
    <g clip-path="url(#bar)">
      <rect x="25" y="60" width="158" height="8" fill="#00E5FF"/>
      <rect x="183" y="60" width="43" height="8" fill="#3882F6"/>
      <rect x="226" y="60" width="32" height="8" fill="#885CFF"/>
      <rect x="258" y="60" width="21" height="8" fill="#D946EF"/>
      <rect x="279" y="60" width="16" height="8" fill="#FF3DC8"/>
    </g>
    <g font-family="'Segoe UI', Ubuntu, sans-serif" font-size="14" fill="#F8FAFC">
      <circle cx="25" cy="95" r="4.5" fill="#00E5FF"/><text x="40" y="100">Python</text>
      <circle cx="175" cy="95" r="4.5" fill="#FF3DC8"/><text x="190" y="100">Terraform</text>

      <circle cx="25" cy="125" r="4.5" fill="#3882F6"/><text x="40" y="130">TypeScript</text>
      <circle cx="175" cy="125" r="4.5" fill="#00E5FF"/><text x="190" y="130">JavaScript</text>

      <circle cx="25" cy="155" r="4.5" fill="#885CFF"/><text x="40" y="160">Shell</text>
      <circle cx="175" cy="155" r="4.5" fill="#3882F6"/><text x="190" y="160">HTML</text>

      <circle cx="25" cy="185" r="4.5" fill="#D946EF"/><text x="40" y="190">Go</text>
      <circle cx="175" cy="185" r="4.5" fill="#885CFF"/><text x="190" y="190">CSS</text>
    </g>
  </g>
</svg>
