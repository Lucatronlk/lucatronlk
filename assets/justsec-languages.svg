<svg xmlns="http://www.w3.org/2000/svg" width="304" height="270" viewBox="0 0 304 270" role="img" aria-labelledby="title desc">
  <title id="title">Most Used Languages</title>
  <desc id="desc">Languages I work in: Python, TypeScript, Shell, Go, Terraform, JavaScript, HTML and CSS. Static card.</desc>
  <defs>
    <clipPath id="bar"><rect x="25" y="60" width="254" height="8" rx="4"/></clipPath>
  </defs>
  <rect width="304" height="270" rx="4.5" fill="none"/>
  <text x="25" y="40" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="18" font-weight="600" fill="#00D5FF">Most Used Languages</text>
  <g clip-path="url(#bar)">
    <rect x="25" y="60" width="150" height="8" fill="#00E5FF"/>
    <rect x="175" y="60" width="40" height="8" fill="#3882F6"/>
    <rect x="215" y="60" width="30" height="8" fill="#885CFF"/>
    <rect x="245" y="60" width="20" height="8" fill="#D946EF"/>
    <rect x="265" y="60" width="14" height="8" fill="#FF3DC8"/>
  </g>
  <g font-family="'Segoe UI', Ubuntu, sans-serif" font-size="14" fill="#F8FAFC">
