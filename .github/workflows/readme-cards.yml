name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

env:
  THEME: "theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=1F6FEB&text_color=C9D1D9"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e
        with:
          card: stats
          options: "username=Lucatronlk&show_icons=true&include_all_commits=true&hide_rank=true&number_format=short&${{ env.THEME }}"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Languages
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e
        with:
          card: top-langs
          options: "username=Lucatronlk&layout=compact&langs_count=8&${{ env.THEME }}"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Streak
        uses: DenverCoder1/github-readme-streak-stats@51cfb8879073b4c016ce6286016de0b14d179077
        with:
          options: "user=Lucatronlk&hide_border=true&disable_animations=true&background=0D1117&stroke=30363D&ring=58A6FF&fire=FF6B6B&currStreakNum=C9D1D9&sideNums=C9D1D9&currStreakLabel=58A6FF&sideLabels=58A6FF&dates=8B949E&timezone=Europe/Bucharest"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile/
          git diff --staged --quiet && exit 0
          git commit -m "chore: update GitHub stats"
          git push